services:

  db:
    image: postgres:18
    container_name: db_manager
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - ./database/data:/var/lib/postgresql
    networks:
      - app_network

  express:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_manage
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  manager:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: manager
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - express
      - manager
    networks:
      - app_network

  certbot:
    image: certbot/certbot
    container_name: certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  certbot_conf:
  certbot_www: